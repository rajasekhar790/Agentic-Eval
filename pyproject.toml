[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-eval"
version = "0.1.0"
description = "Evaluation framework for agentic AI systems measuring reasoning, tool usage, workflow reliability, and task success."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agentic", "evaluation", "ai", "llm", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agentic-eval = "agentic_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
